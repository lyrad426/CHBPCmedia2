<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>In Defense of Truth Radio Ministry by Cub Hill Bible Church</title>

    <link rel="stylesheet" href="design-condensed-pass5.css">
</head>


<body class="broadcast-page broadcast-idot">

<div class="container">


    <header class="broadcast-header">

        <h1>Weekly Broadcasts</h1>

        <h2>In Defense of Truth</h2>

        <p>
            "In Defense Of Truth" is a 15 minute radio ministry of Cub Hill Bible Church. The radio broadcast airs on WCBM in Baltimore, MD every Sunday morning at _am. Archived copies can be heard below and via Spotify podcast.
        </p>

    </header>


    <div class="broadcast-controls">

        <button
            id="sortBtn"
            class="broadcast-sort"
            type="button">

            Sort: Newest First

        </button>

    </div>


    <section
        id="feed"
        class="broadcast-feed"
        aria-live="polite">
    </section>


</div>


<script>

/* =====================================================
   RSS FEED SETTINGS
   ===================================================== */

const feedUrl =
    'https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/rss.xml';

const filterKeyword = "of";


/* =====================================================
   RSS FEED ENGINE
   ===================================================== */

let feedItems = [];

let sortNewestFirst = true;


async function fetchFeed() {

    const response =
        await fetch(feedUrl);

    const data =
        await response.json();

    feedItems =
        data.items || [];

    renderFeed();
}


function renderFeed() {

    let filtered =
        feedItems.filter(item =>

            item.title
                .toLowerCase()
                .includes(
                    filterKeyword.toLowerCase()
                )

            ||

            item.description
                .toLowerCase()
                .includes(
                    filterKeyword.toLowerCase()
                )
        );


    filtered.sort((a, b) => {

        return sortNewestFirst

            ? new Date(b.pubDate) -
              new Date(a.pubDate)

            : new Date(a.pubDate) -
              new Date(b.pubDate);
    });


    const feedDiv =
        document.getElementById("feed");

    feedDiv.innerHTML = "";


    filtered.forEach(item => {

        feedDiv.innerHTML += `

            <article class="media-card broadcast-item">

                <div class="broadcast-icon">

                    <img
                        class="media-thumbnail"
                        src="tape.png"
                        alt="">

                </div>


                <div class="media-info broadcast-content">

                    <h3 class="broadcast-title">

                        <a
                            href="${item.link}"
                            target="_blank"
                            rel="noopener">

                            ${item.title}

                        </a>

                    </h3>


                    <div class="broadcast-date">

                        ${new Date(item.pubDate)
                            .toLocaleString()}

                    </div>


                    <div class="broadcast-description">

                        ${item.description}

                    </div>

                </div>

            </article>

        `;
    });
}


document
    .getElementById("sortBtn")
    .addEventListener("click", () => {

        sortNewestFirst =
            !sortNewestFirst;

        document.getElementById("sortBtn")
            .innerText =
                `Sort: ${
                    sortNewestFirst
                        ? "Newest First"
                        : "Oldest First"
                }`;

        renderFeed();
    });


fetchFeed();

</script>
<p align="right">August 2026</p>
</body>
</html>
